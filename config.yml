version: 2.1


jobs:
  build:
    docker:
      - image: cimg/python:3.11


    steps:
      - checkout


      - run:
          name: Run Python Program
          command: python main.py


      - run:
          name: Run Tests
          command: python -m unittest test.py


workflows:
  version: 2
  build_and_test:
    jobs:
      - build
